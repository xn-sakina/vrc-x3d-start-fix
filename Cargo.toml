[package]
name = "vrchat-x3d-start-fix"
version = "0.1.4"
edition = "2024"
description = "A Windows tray utility that perturbs CPU scheduling during VRChat startup"
license = "MIT"

[lib]
name = "vrchat_x3d_start_fix"
path = "src/lib.rs"

[[bin]]
name = "vrchat-x3d-start-fix"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
core_affinity = "0.8"
crossbeam-channel = "0.5"
directories = "6.0"
file-rotate = "0.8"
ignore = "=0.4.23"
rust-i18n = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json"] }

[target.'cfg(target_os = "windows")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.3"
single-instance = "0.3"
sysinfo = "0.31"
tray-icon = "0.21"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
