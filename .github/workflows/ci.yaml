name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in x.y.z format, for example: 1.0.0. Do not include v. Must match Cargo.toml."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease for testing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      APP_NAME: vrchat-x3d-start-fix

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
          cache-on-failure: true

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$env:VERSION'. Use a value like 1.0.0 without v."
          }

          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages |
            Where-Object { $_.name -eq $env:APP_NAME } |
            Select-Object -First 1
          if ($null -eq $package) {
            throw "Package '$env:APP_NAME' was not found in Cargo metadata."
          }
          if ($package.version -ne $env:VERSION) {
            throw "Release version '$env:VERSION' does not match Cargo.toml version '$($package.version)'."
          }

      - name: Build Windows executable
        shell: pwsh
        run: |
          cargo build --locked --release
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item `
            -Path "target/release/${env:APP_NAME}.exe" `
            -Destination "dist/${env:APP_NAME}-v${env:VERSION}-windows-x64.exe" `
            -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: dist/vrchat-x3d-start-fix-v${{ env.VERSION }}-windows-x64.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: windows-release-asset
          path: release-assets

      - name: Create release
        shell: bash
        run: |
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "v${VERSION}" \
            "${release_flags[@]}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "" \
            "release-assets/vrchat-x3d-start-fix-v${VERSION}-windows-x64.exe"
